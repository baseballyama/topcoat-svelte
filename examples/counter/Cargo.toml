[package]
name = "counter-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Server-render the counter island (and hydrate it on the client). Run the
# example with `cargo run -p counter-example --features ssr`. Off by default so
# the plain workspace build needs no C toolchain.
ssr = ["topcoat-svelte/ssr"]

[dependencies]
topcoat = { workspace = true }
topcoat-svelte = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
