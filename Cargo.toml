[workspace]
resolver = "3"
members = [
    "crates/topcoat-svelte",
    "crates/topcoat-svelte-macro",
    "examples/counter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/baseballyama/topcoat-svelte"

[workspace.dependencies]
topcoat-svelte = { path = "crates/topcoat-svelte", version = "0.1.0" }
topcoat-svelte-macro = { path = "crates/topcoat-svelte-macro", version = "0.1.0" }
topcoat = "0.4"
topcoat-view = "0.4"
topcoat-router = "0.4"
# rsvelte is not on crates.io yet, and a `git` dependency on the rsvelte repo
# does not work today: cargo fetches git submodules of git dependencies
# recursively, and rsvelte's test-fixture submodules are huge (typescript-go,
# svelte.dev), partly SSH-only (vize, corsa-bind), and currently fail to
# resolve at all (`submodules/vize` nests a `temp_web/element` submodule with
# no URL configured). Until rsvelte_core is published, build with a sibling
# checkout: `git clone https://github.com/baseballyama/rsvelte ../rsvelte`.
rsvelte_core = { path = "../rsvelte/crates/rsvelte_core" }
serde = "1"
serde_json = "1"
inventory = "0.3"
sha2 = "0.10"
# The `ssr` feature embeds QuickJS (via rquickjs) to run rsvelte's server output.
# rquickjs-sys builds QuickJS from C, so an `ssr` build needs a C compiler; the
# default (CSR-only) build does not.
rquickjs = "0.12"
tokio = "1"
proc-macro2 = "1"
quote = "1"
syn = "2"
# oxc parses the rsvelte-compiled client JS so the `svelte!` macro can rewrite
# only genuine `.svelte` import specifiers (never look-alike string literals).
# Pinned to the same 0.139 line rsvelte_core already builds against.
oxc_allocator = "0.139"
oxc_ast = "0.139"
oxc_parser = "0.139"
oxc_span = "0.139"
