[workspace]
resolver = "3"
members = [
    "crates/topcoat-svelte",
    "crates/topcoat-svelte-macro",
    "examples/counter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/baseballyama/topcoat-svelte"

[workspace.dependencies]
topcoat-svelte = { path = "crates/topcoat-svelte", version = "0.1.0" }
topcoat-svelte-macro = { path = "crates/topcoat-svelte-macro", version = "0.1.0" }
topcoat = "0.4"
topcoat-view = "0.4"
topcoat-router = "0.4"
rsvelte_core = { path = "../rsvelte/crates/rsvelte_core" }
serde = "1"
serde_json = "1"
inventory = "0.3"
sha2 = "0.10"
tokio = "1"
proc-macro2 = "1"
quote = "1"
syn = "2"
